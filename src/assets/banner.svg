<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1917"/>
      <stop offset="50%" style="stop-color:#292524"/>
      <stop offset="100%" style="stop-color:#1c1917"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#fbbf24;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.2"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <!-- Glow orbs -->
  <ellipse cx="200" cy="200" rx="250" ry="200" fill="#d97706" opacity="0.08" filter="url(#blur1)"/>
  <ellipse cx="1000" cy="150" rx="300" ry="180" fill="#fbbf24" opacity="0.06" filter="url(#blur2)"/>
  <ellipse cx="600" cy="350" rx="400" ry="120" fill="#92400e" opacity="0.1" filter="url(#blur1)"/>
  <!-- Grid lines (tech feel) -->
  <g stroke="#fbbf24" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/><line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/><line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>
  <!-- Redstone dots -->
  <g fill="#ef4444" opacity="0.5">
    <circle cx="150" cy="100" r="3"/><circle cx="350" cy="180" r="2"/>
    <circle cx="550" cy="90" r="3"/><circle cx="750" cy="250" r="2"/>
    <circle cx="950" cy="120" r="3"/><circle cx="1050" cy="300" r="2"/>
  </g>
  <!-- Redstone lines -->
  <g stroke="#ef4444" stroke-opacity="0.2" stroke-width="1.5" fill="none">
    <path d="M150 100 L350 180 L550 90"/><path d="M750 250 L950 120 L1050 300"/>
    <path d="M550 90 L750 250"/>
  </g>
  <!-- Title text -->
  <text x="600" y="170" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#fafaf9" letter-spacing="4">一秋小镇</text>
  <text x="600" y="220" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#fbbf24" letter-spacing="8" opacity="0.9">YIQIU TOWN WIKI</text>
  <text x="600" y="280" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#a8a29e" letter-spacing="3">纯粹生电 · 硬核红石 · 极致流畅</text>
  <!-- Bottom accent line -->
  <rect x="400" y="310" width="400" height="2" rx="1" fill="url(#glow)"/>
</svg>
